name: Ejecutar Pruebas Unitarias

on:
  push:
    branches: [main, master, develop, Feats_Akion]
  pull_request:
    branches: [main, master, develop, Feats_Akion]

jobs:
  test:
    name: Ejecutar Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

