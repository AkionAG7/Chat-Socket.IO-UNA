name: Linting with ESLint

on:
  workflow_run:
    workflows: ["Ejecutar Pruebas Unitarias"]
    types:
      - completed

jobs:
  lint:
    runs-on: ubuntu-latest
    # Solo ejecutar si el workflow de test fue exitoso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm" # Cachea node_modules para builds más rápidos

      - name: Install dependencies
        run: npm ci # Instalación limpia para CI

      - name: Run ESLint
        run: npm run lint:ci # Falla si hay errores o warnings
