name: Deploy & Nuclei (development)

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  # (Opcional) Despliegue: déjalo o quítalo según tu proveedor
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # EJEMPLO Render (coméntalo si no usas Render)
      - name: Trigger Render Deploy
        if: ${{ secrets.RENDER_SERVICE_ID != '' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}' \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys

  nuclei:
    needs: [deploy]
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ secrets.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Esperar a que el healthcheck responda
        run: |
          echo "Esperando $TARGET_URL/healthz ..."
          for i in {1..30}; do
            if curl -sfL "$TARGET_URL/healthz" >/dev/null; then
              echo "OK"; exit 0
            fi
            echo "Intento $i/30..."; sleep 10
          done
          echo "Healthcheck no disponible a tiempo"; exit 1

      - name: Ejecutar Nuclei (ProjectDiscovery)
        uses: projectdiscovery/nuclei-action@v2
        with:
          target: ${{ env.TARGET_URL }}
          flags: "-as -silent"         # auto-select de templates
          # Si prefieres tu YAML: flags: "-config nuclei-config.yaml -silent"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report
          path: nuclei-report.txt
