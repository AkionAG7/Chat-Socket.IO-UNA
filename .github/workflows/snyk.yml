name: Snyk Security Scan

on:
  pull_request:
    branches: [main, master, develop, Feats_Akion]
  schedule:
    # Ejecutar escaneo semanal los lunes a las 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_run:
    workflows: ["Linting with ESLint"]
    types:
      - completed

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  snyk-security:
    runs-on: ubuntu-latest
    # Solo ejecutar si viene de schedule (independiente), pull_request directo, o si el workflow de lint fue exitoso
    if: ${{ github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para verificar el estado del workflow anterior

      # Si se ejecuta por pull_request, esperar a que lint complete
      - name: Esperar a que lint complete (si es pull_request)
        if: github.event_name == 'pull_request'
        uses: lewis6991/wait@v1
        with:
          check-name: 'Linting with ESLint'
          check-repo: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          wait-interval: 10
          allowed-conclusions: success

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Debug Snyk token and test connection
        run: |
          echo "🔍 Debugging Snyk token..."
          if [ -z "$SNYK_TOKEN" ]; then
            echo "❌ SNYK_TOKEN is not set"
            exit 1
          else
            echo "✅ SNYK_TOKEN is set (length: ${#SNYK_TOKEN})"
            echo "Token starts with: ${SNYK_TOKEN:0:10}..."
          fi

          echo "🔍 Testing Snyk connection..."
          npx snyk auth --token=$SNYK_TOKEN
          echo "✅ Snyk authentication successful"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

      - name: Comment PR with Snyk results
        if: github.event_name == 'pull_request'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  snyk-monitor:
    runs-on: ubuntu-latest
    # Solo ejecutar si es push a main/master (no en PRs)
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Debug Snyk token and test connection
        run: |
          echo "🔍 Debugging Snyk token..."
          if [ -z "$SNYK_TOKEN" ]; then
            echo "❌ SNYK_TOKEN is not set"
            exit 1
          else
            echo "✅ SNYK_TOKEN is set (length: ${#SNYK_TOKEN})"
            echo "Token starts with: ${SNYK_TOKEN:0:10}..."
          fi

          echo "🔍 Testing Snyk connection..."
          npx snyk auth --token=$SNYK_TOKEN
          echo "✅ Snyk authentication successful"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Monitor project with Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
