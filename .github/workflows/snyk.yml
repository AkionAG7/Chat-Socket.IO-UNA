name: Snyk Security Scan

on:
  pull_request:
    branches: [main, master, develop, Feats_Akion]
  schedule:
    # Ejecutar escaneo semanal los lunes a las 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_run:
    workflows: ["Linting with ESLint"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  snyk-security:
    runs-on: ubuntu-latest
    # Solo ejecutar si viene de schedule (independiente), pull_request directo, o si el workflow de lint fue exitoso
    if: ${{ github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para verificar el estado del workflow anterior

      # Si se ejecuta por pull_request, esperar a que lint complete
      - name: Esperar a que lint complete (si es pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const workflowName = 'Linting with ESLint';
            
            console.log(`⏳ Esperando a que el workflow "${workflowName}" complete...`);
            console.log(`📌 Commit SHA: ${sha}`);
            
            let maxAttempts = 60; // 10 minutos máximo (60 * 10 segundos)
            let attempt = 0;
            
            while (attempt < maxAttempts) {
              attempt++;
              
              // Buscar el workflow run del commit
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: sha,
                per_page: 10
              });
              
              // Buscar el workflow específico
              const workflowRuns = runs.data.workflow_runs.filter(run => 
                run.name === workflowName && run.head_sha === sha
              );
              
              if (workflowRuns.length > 0) {
                const latestRun = workflowRuns[0];
                const status = latestRun.status;
                const conclusion = latestRun.conclusion;
                
                console.log(`📊 Estado: ${status}, Conclusión: ${conclusion || 'pending'}`);
                
                if (status === 'completed') {
                  if (conclusion === 'success') {
                    console.log('✅ El workflow de lint completó exitosamente');
                    return;
                  } else {
                    console.log(`❌ El workflow de lint falló con conclusión: ${conclusion}`);
                    core.setFailed(`El workflow "${workflowName}" falló con conclusión: ${conclusion}`);
                    return;
                  }
                }
              }
              
              if (attempt < maxAttempts) {
                console.log(`⏳ Intento ${attempt}/${maxAttempts} - Esperando 10 segundos...`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
            
            core.setFailed(`Timeout: El workflow "${workflowName}" no completó en el tiempo esperado`);

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Debug Snyk token and test connection
        run: |
          echo "🔍 Debugging Snyk token..."
          if [ -z "$SNYK_TOKEN" ]; then
            echo "❌ SNYK_TOKEN is not set"
            exit 1
          else
            echo "✅ SNYK_TOKEN is set (length: ${#SNYK_TOKEN})"
            echo "Token starts with: ${SNYK_TOKEN:0:10}..."
          fi

          echo "🔍 Testing Snyk connection..."
          npx snyk auth --token=$SNYK_TOKEN
          echo "✅ Snyk authentication successful"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

      - name: Comment PR with Snyk results
        if: github.event_name == 'pull_request'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  snyk-monitor:
    runs-on: ubuntu-latest
    # Solo ejecutar si es push a main/master (no en PRs)
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Debug Snyk token and test connection
        run: |
          echo "🔍 Debugging Snyk token..."
          if [ -z "$SNYK_TOKEN" ]; then
            echo "❌ SNYK_TOKEN is not set"
            exit 1
          else
            echo "✅ SNYK_TOKEN is set (length: ${#SNYK_TOKEN})"
            echo "Token starts with: ${SNYK_TOKEN:0:10}..."
          fi

          echo "🔍 Testing Snyk connection..."
          npx snyk auth --token=$SNYK_TOKEN
          echo "✅ Snyk authentication successful"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Monitor project with Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
