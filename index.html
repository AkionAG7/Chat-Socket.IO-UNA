<!doctype html>
<html lang="es">
  <head>
    <title>Laboratorio Integrado - UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #eceff3;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .hub {
        background: #ffffff;
        padding: 36px;
        border-radius: 10px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.05);
        text-align: center;
        max-width: 420px;
        width: 100%;
      }

      .hub h1 {
        margin-bottom: 12px;
        color: #1a1f36;
        font-size: 24px;
        font-weight: 700;
      }

      .hub p {
        color: #5b627e;
        margin-bottom: 26px;
        font-size: 14px;
      }

      .btn-link {
        display: block;
        background: #0A66C2; /* azul más puro */
        color: white;
        padding: 14px;
        margin: 10px auto;
        border-radius: 6px;
        text-decoration: none;
        width: 85%;
        font-weight: 600;
        transition: background 0.2s;
      }

      .btn-link:hover {
        background: #084f96; /* mismo azul pero más oscuro */
      }

      footer {
        margin-top: 18px;
        font-size: 12px;
        color: #8690a8;
      }
    </style>
  </head>
  <body>
    <div class="hub">
      <h1>Laboratorio Integrado</h1>
      <p>Seleccione una sección del laboratorio</p>

      <a class="btn-link" href="/chat">Chat en tiempo real</a>
      <a class="btn-link" href="/calculadora">Calculadora de Riesgo</a>

      <footer>Universidad Nacional de Costa Rica</footer>
    </div>
  </body>
</html>
